<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shweta ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      max-width: 320px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    .buttons {
      margin-top: 25px;
      position: relative;
      height: 60px;
    }

    button {
      padding: 12px 22px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      position: absolute;
      transition: 0.3s ease;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      left: 20px;
    }

    #no {
      background: #ccc;
      right: 20px;
    }

    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 20px;
      animation: float 4s linear infinite;
    }

    @keyframes float {
      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Hey Shweta ❤️</h1>
    <p>
      Ever since you came into my life,<br>
      everything feels brighter ✨
    </p>
    <h2>Will you be my Valentine? 🌹</h2>

    <div class="buttons">
      <button id="yes" onclick="yes()">Yes 💖</button>
      <button id="no">No 🙈</button>
    </div>
  </div>

  <script>
    const no = document.getElementById("no");

    no.addEventListener("mouseover", () => {
      no.style.transform =
        `translate(${Math.random()*150-75}px, ${Math.random()*80-40}px)`;
    });

    function yes() {
      document.body.innerHTML = `
        <div style="text-align:center;color:white;">
          <h1 style="font-size:40px;">YAY Shweta 🥹💖</h1>
          <p style="font-size:20px;">
            You just made me the happiest person ever.
          </p>
          <p style="font-size:18px;">
            I promise to make this Valentine unforgettable 🌹✨
          </p>
        </div>
      `;
    }

    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random()*100 + "vw";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }, 300);
  </script>

</body>
</html>
